<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt()+';'),M=n=>'AED '+Number(n).toFixed(2);
let D,cart={};try{cart=JSON.parse(localStorage.cc||'{}')}catch(e){}
const sv=()=>{try{localStorage.cc=JSON.stringify(cart)}catch(e){}},P=id=>D.p.find(p=>p.id==id),st=p=>p.u=='kg'?.5:1;
const of=()=>D.p.filter(p=>p.old>p.pr),still=()=>!matchMedia('(prefers-reduced-motion:reduce)').matches;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
const reveal=()=>document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e));
const catName=id=>(D.cats.find(c=>c.id==id)||{}).n||'';
/* ---------- product cards ---------- */
const card=(p,i)=>`<article class="pc rv" style="--i:${i%6}"><div class="im" data-open="${E(p.id)}"><img class="ph" src="logo.png" alt="" aria-hidden="true">${p.img?`<img class="pp" loading="lazy" decoding="async" src="${E(p.img)}" alt="${E(p.n)}" onerror="this.remove()">`:''}${p.old>p.pr?`<b class="tag">-${Math.round(100-p.pr/p.old*100)}%</b>`:''}</div><h4><a href="#" class="ln" data-open="${E(p.id)}">${E(p.n)}</a></h4><div class="pr">${M(p.pr)}<small> / ${E(p.u)}</small>${p.old>p.pr?`<s>${M(p.old)}</s>`:''}</div><button class="btn" data-add="${E(p.id)}">Add to basket</button></article>`;
const grid=(l,msg)=>l.length?`<div class="pg">${l.map(card).join('')}</div>`:`<p class="em">${msg||'Nothing here yet. Check back soon.'}</p>`;
const sec=(t,b,l,sub)=>b?`<section><div class="sh"><div><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div>${l?`<a href="${l}">View all</a>`:''}</div>${b}</section>`:'';
/* ---------- sortable / filterable list pages ---------- */
let LV={sort:'',off:0},cur=null;
const sorted=l=>{l=l.slice();if(LV.off)l=l.filter(p=>p.old>p.pr);const s=LV.sort;if(s=='pa')l.sort((a,b)=>a.pr-b.pr);else if(s=='pd')l.sort((a,b)=>b.pr-a.pr);else if(s=='na')l.sort((a,b)=>a.n.localeCompare(b.n));return l};
function listPage(title,get,msg,sub){cur={get,msg};LV={sort:'',off:0};const n=get().length;return `<section><div class="sh"><div><h2>${title}</h2><p>${sub||n+' item'+(n==1?'':'s')}</p></div></div>${n?`<div class="tb"><label>Sort <select id="so"><option value="">Default</option><option value="pa">Price: low to high</option><option value="pd">Price: high to low</option><option value="na">Name A to Z</option></select></label><label class="ck"><input type="checkbox" id="fo"> Offers only</label></div>`:''}<div id="lg">${grid(sorted(get()),msg)}</div></section>`}
function relist(){if(!cur)return;$('#lg').innerHTML=grid(sorted(cur.get()),LV.off?'No offers in this list right now.':cur.msg);reveal()}
/* ---------- home ---------- */
const tile=(c,k)=>{const n=D.p.filter(p=>p.c==c.id).length;return `<a class="ct rv${c.img?'':' noimg'}" style="--i:${k%4}" href="#cat/${E(c.id)}">${c.img?`<img loading="lazy" decoding="async" src="${E(c.img)}" alt="" onerror="this.parentNode.classList.add('noimg');this.remove()">`:''}<span><b>${E(c.n)}</b><small>${n} item${n==1?'':'s'}</small></span></a>`};
function dealSec(){const d=D.p.find(p=>p.deal);if(!d)return'';return `<section><div class="deal rv"><div class="di im" style="border-radius:0" data-open="${E(d.id)}"><img class="ph" src="logo.png" alt="" aria-hidden="true">${d.img?`<img class="pp" loading="lazy" src="${E(d.img)}" alt="${E(d.n)}" onerror="this.remove()">`:''}</div><div class="dt"><span class="lb">Deal of the day</span><h3>${E(d.n)}</h3><div class="pr">${M(d.pr)}<small> / ${E(d.u)}</small>${d.old>d.pr?`<s>${M(d.old)}</s>`:''}</div><div class="cd" id="cd"></div><div><button class="btn" data-add="${E(d.id)}">Add to basket</button></div></div></div></section>`}
function home(){const c=D.cfg,hasOffers=of().length>0;
return `<div class="hero"><div class="hc"><span class="ey">The Commons, Mirdif</span><h1>Fresh groceries, better living.</h1><p>Fresh food and everyday essentials from your neighbourhood supermarket. Order on WhatsApp. ${E(c.free)}.</p><div class="hb"><a class="btn w" href="#cat/${D.cats[0].id}">Shop now</a><a class="btn o" href="https://wa.me/${E(c.wa)}" target="_blank" rel="noopener">Chat on WhatsApp</a></div><div class="tr"><span>Fresh every day</span><span>Open ${E(c.hours)}</span><span>No online payment</span></div></div><div class="hv" id="hv"></div></div>
<div class="why"><div><b>Fresh every day</b><small>Fruit, vegetables, butchery, seafood and bakery</small></div><div><b>Free local delivery</b><small>${E(c.free)}</small></div><div><b>Order on WhatsApp</b><small>Our team confirms every order with you</small></div><div><b>Open late</b><small>${E(c.hours)}</small></div></div>
${sec('Shop by category','<div class="cg">'+D.cats.map(tile).join('')+'</div>')}
${dealSec()}
<div class="bn"><a class="b1 rv" href="#offers"><h3>Special offers</h3><span>${hasOffers?'Save on everyday items':'Check back soon for new offers'}</span></a><a class="b2 rv" href="#new"><h3>New arrivals</h3><span>Just added to our shelves</span></a></div>
${sec('Featured products',D.p.some(p=>p.feat)?grid(D.p.filter(p=>p.feat).slice(0,10)):'','','Hand-picked by our team')}
${sec('Best sellers',D.p.some(p=>p.best)?grid(D.p.filter(p=>p.best).slice(0,10)):'','','Customer favourites')}
${sec('Special offers',hasOffers?grid(of().slice(0,10)):'','#offers')}
${sec('New arrivals',grid(D.p.slice(-10).reverse()),'#new')}`}
function heroVisual(){const h=$('#hv');if(!h)return;const i=new Image();i.onload=()=>{h.innerHTML='<img class="hh" alt="" src="images/hero.jpg">';h.classList.add('has')};i.onerror=()=>{h.innerHTML='<div class="mo">'+['fruits','vegetables','bakery'].map(x=>{const c=D.cats.find(k=>k.id==x);return c&&c.img?`<img alt="" src="${E(c.img)}" onload="document.getElementById('hv').classList.add('has')" onerror="this.remove()">`:''}).join('')+'</div>'};i.src='images/hero.jpg'}
const about=()=>`<section class="tx"><h2>About Coccinelle</h2><p>Coccinelle Supermarket is a neighbourhood market at The Commons, Mirdif. Fresh food and everyday essentials are under one roof: fruit and vegetables, butchery, seafood, bakery, beverages, household, and health and beauty.</p><p>Coccinelle is part of a network of about 800 stores, from supermarkets to convenience stores. Its own brands cover nearly 2,000 everyday products at good value, and the Cocci loyalty card rewards regular shoppers in store.</p><p>Live nearby? Order on WhatsApp. ${E(D.cfg.free)}.</p><p><a class="btn" href="${E(D.cfg.web)}" target="_blank" rel="noopener">Visit coccinelle.ae</a></p></section>`;
const contact=()=>`<section class="tx"><h2>Visit or contact us</h2><p><b>Address:</b> ${E(D.cfg.addr)}</p><p><b>Open:</b> ${E(D.cfg.hours)}</p><p><b>Phone:</b> <a href="tel:${E(D.cfg.phone)}">${E(D.cfg.phoneLabel)}</a></p><p><a class="btn" href="https://wa.me/${E(D.cfg.wa)}" target="_blank" rel="noopener">Chat on WhatsApp</a> <a class="btn k" href="${E(D.cfg.map)}" target="_blank" rel="noopener">Open in Maps</a></p><div class="lk"><a href="${E(D.cfg.ig)}" target="_blank" rel="noopener">Instagram</a><a href="${E(D.cfg.fb)}" target="_blank" rel="noopener">Facebook</a><a href="${E(D.cfg.cat)}" target="_blank" rel="noopener">WhatsApp catalogue</a></div></section>`;
/* ---------- routing / search ---------- */
function route(){if(!D)return;$('#q').value='';const h=decodeURIComponent(location.hash.slice(1)||'home').split('/'),a=h[0],c=D.cats.find(x=>x.id==h[1]);cur=null;
const pages={home,about,contact,offers:()=>listPage('Special offers',of,'No special offers right now. Check back soon.'),deals:()=>sec('Deal of the day',grid(D.p.filter(p=>p.deal),'No deal of the day right now.'))+listPage('All discounted items',of,'No discounted items right now.'),new:()=>sec('New arrivals',grid(D.p.slice(-12).reverse())),cat:()=>c?listPage(E(c.n),()=>D.p.filter(p=>p.c==c.id)):home()};
$('#app').innerHTML=(pages[a]||home)();
const cu='#'+(a=='cat'?'cat/'+h[1]:a);document.querySelectorAll('nav a').forEach(x=>{const on=x.getAttribute('href')==cu;x.classList.toggle('on',on);if(on)x.scrollIntoView({inline:'center',block:'nearest'})});
document.title=(a=='cat'&&c?c.n+' | ':'')+'Coccinelle Supermarket, The Commons, Mirdif, Dubai';
scrollTo(0,0);reveal();heroVisual();tick()}
let qt;function srch(){clearTimeout(qt);qt=setTimeout(()=>{const v=$('#q').value.trim().toLowerCase();if(v.length<2)return route();$('#app').innerHTML=listPage('Results for "'+E(v)+'"',()=>D.p.filter(p=>(p.n+' '+catName(p.c)).toLowerCase().includes(v)),'No products match your search. Try another word or browse a category.');reveal()},150)}
function tick(){const e=$('#cd');if(!e)return;const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.floor((m-n)/1e3),f=x=>String(x).padStart(2,'0');e.textContent=`Offer day ends in ${f(s/3600|0)}:${f(s%3600/60|0)}:${f(s%60)}`}
setInterval(tick,1000);
/* ---------- product details ---------- */
let pq=1,pid=null;
function openP(id){const p=P(id);if(!p)return;pid=id;pq=st(p);
$('#pm').innerHTML=`<div class="pb"><button class="pcl" data-close="pm" aria-label="Close">×</button><div class="im pi"><img class="ph" src="logo.png" alt="" aria-hidden="true">${p.img?`<img class="pp" src="${E(p.img)}" alt="${E(p.n)}" onerror="this.remove()">`:''}${p.old>p.pr?`<b class="tag">-${Math.round(100-p.pr/p.old*100)}%</b>`:''}</div><div class="pd"><span class="eb">${E(catName(p.c))}</span><h3>${E(p.n)}</h3><div class="pr">${M(p.pr)}<small> / ${E(p.u)}</small>${p.old>p.pr?`<s>${M(p.old)}</s>`:''}</div>${p.d?`<p class="ds">${E(p.d)}</p>`:''}<div class="qr"><button data-pq="-1" aria-label="Less">−</button><output id="pqv"></output><span>${E(p.u)}</span><button data-pq="1" aria-label="More">+</button></div><button class="btn" data-padd="1">Add to basket · <span id="pqt"></span></button></div></div>`;pqu();$('#pm').classList.add('o');const b=$('#pm .pcl');if(b)b.focus()}
function pqu(){const p=P(pid);$('#pqv').textContent=pq;$('#pqt').textContent=M(p.pr*pq)}
/* ---------- basket maths (integer fils) ---------- */
const FIL=n=>Math.round(n*100),A=n=>M(n/100),lineF=p=>Math.round(FIL(p.pr)*cart[p.id]);
const items=()=>Object.keys(cart).map(P).filter(Boolean),upd=()=>{$('#cn').textContent=items().length};
function calc(type){const c=D.cfg,sub=items().reduce((s,p)=>s+lineF(p),0);let disc=0;if(+c.discountPct>0&&sub>=FIL(+c.discountMin||0))disc=Math.round(sub*c.discountPct/100);const fee=type=='Delivery'?FIL(+c.deliveryFee||0):0;return{sub,disc,fee,total:sub-disc+fee}}
function fly(b){const c=b.closest('.pc,.deal,.pb'),s=(c&&c.querySelector('.im'))||b,r=s.getBoundingClientRect(),t=$('.cb').getBoundingClientRect(),d=document.createElement('div');d.className='fly';d.style.left=(r.left+r.width/2-22)+'px';d.style.top=(r.top+r.height/2-22)+'px';document.body.append(d);
d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${t.left+t.width/2-r.left-r.width/2}px,${t.top+t.height/2-r.top-r.height/2}px) scale(.25)`,opacity:.3}],{duration:700,easing:'cubic-bezier(.5,-.2,.7,.4)'}).onfinish=()=>d.remove()}
function add(id,b,q){const p=P(id);if(!p)return;cart[id]=+((cart[id]||0)+(q||st(p))).toFixed(1);sv();upd();const x=$('.cb');x.classList.remove('bump');void x.offsetWidth;x.classList.add('bump');if(b&&still())fly(b)}
function chg(id,d){const p=P(id);if(!p)return;cart[id]=Math.max(0,+((cart[id]||0)+d*st(p)).toFixed(1));if(!cart[id])delete cart[id];sv();upd();drawer()}
function rm(id){delete cart[id];sv();upd();drawer()}
/* ---------- checkout form state (remembered on this device, notes excluded) ---------- */
let form={t:'Delivery',nm:'',ph:'',lc:'',nt:'',hp:''};try{const s=JSON.parse(localStorage.ccf||'{}');form.nm=s.nm||'';form.ph=s.ph||'';form.lc=s.lc||''}catch(e){}
const saveForm=()=>{try{localStorage.ccf=JSON.stringify({nm:form.nm,ph:form.ph,lc:form.lc})}catch(e){}};
function normPhone(v){let d=String(v).replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='971'+d.slice(1);return d}
function drawer(){const l=items(),t=form.t,c=calc(t),cf=D.cfg;
$('#sh').innerHTML='<h3>Your order</h3>'+(l.length?l.map(p=>`<div class="ci"><span>${E(p.n)}<small>${M(p.pr)} / ${E(p.u)} · ${A(lineF(p))}</small></span><span class="q"><button data-chg="${E(p.id)}" data-d="-1" aria-label="Decrease ${E(p.n)}">−</button><b>${cart[p.id]}</b> ${E(p.u)}<button data-chg="${E(p.id)}" data-d="1" aria-label="Increase ${E(p.n)}">+</button><button class="rm" data-rm="${E(p.id)}" aria-label="Remove ${E(p.n)}">✕</button></span></div>`).join('')+
`<div class="sm"><div><span>Subtotal</span><span>${A(c.sub)}</span></div>${c.disc?`<div><span>Discount</span><span>-${A(c.disc)}</span></div>`:''}${c.fee?`<div><span>Delivery</span><span>${A(c.fee)}</span></div>`:''}<div class="tt"><span>Total</span><span>${A(c.total)}</span></div></div>`+
`<div class="fm"><div class="ty"><label><input type="radio" name="t" value="Delivery" ${t=='Delivery'?'checked':''}> Delivery</label><label><input type="radio" name="t" value="Pickup" ${t=='Pickup'?'checked':''}> Pickup</label></div>${t=='Delivery'?`<p class="hn">${E(cf.free)}.</p>`:`<p class="hn">Collect from ${E(cf.addr)}.</p>`}<input id="nm" placeholder="Your name" autocomplete="name" value="${E(form.nm)}"><input id="ph" type="tel" inputmode="tel" placeholder="Your WhatsApp number" autocomplete="tel" value="${E(form.ph)}">${t=='Delivery'?`<input id="lc" placeholder="Building, area, location" autocomplete="street-address" value="${E(form.lc)}">`:''}<input id="nt" placeholder="Notes for our team (optional)" maxlength="300" value="${E(form.nt)}"><input id="hp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" value=""></div><p class="er" id="er" role="alert"></p><button class="btn" id="sendBtn">Place order on WhatsApp</button><p class="hn">Your order is confirmed only when our team replies on WhatsApp.</p>`:'<p class="em">Your basket is empty.</p>')+`<button class="x" data-close="dr">Close</button>`;
$('#dr').classList.add('o')}
/* ---------- orders: save first, then WhatsApp ---------- */
let FBP;const fb=()=>FBP||(FBP=(async()=>{const u='https://www.gstatic.com/firebasejs/10.12.2/',[a,f]=await Promise.all([import(u+'firebase-app.js'),import(u+'firebase-firestore.js')]);return{f,db:f.getFirestore(a.initializeApp(FB))}})());
async function saveOrder(o){const{f,db}=await fb();await f.setDoc(f.doc(db,'orders',o.orderId),{...o,createdAt:f.serverTimestamp()})}
function orderId(){const d=new Date(),p=n=>String(n).padStart(2,'0'),al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(5));return `CC-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-`+[...r].map(x=>al[x%al.length]).join('')}
const getQ=()=>{try{return JSON.parse(localStorage.ccq||'[]')}catch(e){return[]}},setQ=q=>{try{localStorage.ccq=JSON.stringify(q.slice(-20))}catch(e){}};
function queue(o){setQ(getQ().concat({o,at:Date.now()}))}
async function flushQueue(){const q=getQ().filter(x=>Date.now()-x.at<864e5);if(!q.length)return setQ([]);const keep=[];for(const x of q){try{await saveOrder(x.o)}catch(e){keep.push(x)}}setQ(keep)}
function waText(o,c){const L=o.items.map(i=>`- ${i.name}: ${i.qty} ${i.unit} x ${M(i.unitPrice)} = ${M(i.lineTotal)}`);
return ['Hello Coccinelle, I would like to place an order.','Order ID: '+o.orderId,'',...L,'',`Subtotal: ${M(o.subtotal)}`,...(o.discount?[`Discount: -${M(o.discount)}`]:[]),...(o.deliveryCharge?[`Delivery: ${M(o.deliveryCharge)}`]:[]),`Total: ${M(o.total)}`,'Order type: '+(o.fulfilment=='delivery'?'Delivery':'Pickup'),'Name: '+o.customer.name,'Phone: '+o.customer.phone,...(o.customer.address?['Address: '+o.customer.address]:[]),...(o.notes?['Notes: '+o.notes]:[])].join('\n')}
let busy=0;
async function placeOrder(){if(busy)return;const t=form.t,l=items(),er=m=>{const e=$('#er');if(e)e.textContent=m};if(!l.length)return;
const nm=form.nm.trim(),ph=normPhone(form.ph),lc=form.lc.trim(),c=calc(t);
if(form.hp)return;
if(nm.length<2)return er('Please enter your name.');
if(!/^\d{8,15}$/.test(ph))return er('Please enter a valid WhatsApp number, for example 050 123 4567.');
if(t=='Delivery'&&lc.length<5)return er('Please enter your building, area and location for delivery.');
if(+D.cfg.minOrder>0&&c.sub<FIL(+D.cfg.minOrder))return er('The minimum order is '+M(D.cfg.minOrder)+'.');
if(Date.now()-(+localStorage.cct||0)<15000)return er('Please wait a few seconds before sending another order.');
busy=1;const btn=$('#sendBtn');btn.disabled=true;btn.textContent='Saving your order…';
const w=open('about:blank','_blank');/* opened inside the tap so mobile browsers do not block it */
const id=orderId(),o={orderId:id,status:'awaiting_confirmation',paymentStatus:'pending',fulfilment:t.toLowerCase(),customer:{name:nm,phone:ph,address:t=='Delivery'?lc:''},items:l.map(p=>({id:String(p.id),name:p.n,unit:p.u,cat:String(p.c||""),qty:cart[p.id],unitPrice:p.pr,lineTotal:lineF(p)/100})),subtotal:c.sub/100,discount:c.disc/100,deliveryCharge:c.fee/100,total:c.total/100,currency:'AED',notes:form.nt.trim().slice(0,300),source:'website',totalsVerified:false,clientCreatedAt:new Date().toISOString()};
let saved=false;try{await Promise.race([saveOrder(o),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),7000))]);saved=true}catch(e){queue(o)}
const url='https://wa.me/'+D.cfg.wa+'?text='+encodeURIComponent(waText(o,c));
if(w){try{w.location.href=url}catch(e){}}
