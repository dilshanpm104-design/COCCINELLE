<!DOCTYPE html>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"GroceryStore","name":"Coccinelle Supermarket","url":"https://dilshanpm104-design.github.io/COCCINELLE/","image":"https://dilshanpm104-design.github.io/COCCINELLE/logo.png","telephone":"+97143499605","address":{"@type":"PostalAddress","streetAddress":"The Commons, Ground Floor","addressLocality":"Mirdif","addressRegion":"Dubai","addressCountry":"AE"},"sameAs":["https://www.instagram.com/coccinelledxb/","https://www.facebook.com/profile.php?id=61595464765070"]}</script>

<body>
<a class="skip" href="#app">Skip to content</a>
<div class="bar" id="bar">Welcome to Coccinelle Supermarket</div>
<header>
<a class="lg" href="#home" aria-label="Coccinelle Supermarket home"><img src="logo.png" alt="Coccinelle Supermarket" width="200" height="46"></a>
<label class="sb"><span class="sr">Search products</span><svg class="si" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="Search products" autocomplete="off"></label>
<button class="cb" id="cartBtn" aria-label="Open basket"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><i id="cn">0</i></button>
</header>
<nav aria-label="Categories"></nav>
<main id="app" tabindex="-1"><p class="em" style="padding:30px 0">Loading…</p></main>
<footer>
<div class="fg">
<div><img src="logo.png" alt="Coccinelle Supermarket" width="160" height="46"><p style="margin-top:12px;max-width:26em">Fresh food and everyday essentials from your neighbourhood market.</p></div>
<div id="f1"></div>
<div id="f2"></div>
</div>
<div class="fc">Orders are confirmed by our team on WhatsApp. No online payment. Prices in AED.</div>
</footer>
<div id="dr" role="dialog" aria-modal="true" aria-label="Your basket"><div id="sh"></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt()+';'),M=n=>'AED '+Number(n).toFixed(2);
let D,cart={};try{cart=JSON.parse(localStorage.cc||'{}')}catch(e){}
const sv=()=>{try{localStorage.cc=JSON.stringify(cart)}catch(e){}},P=id=>D.p.find(p=>p.id==id),st=p=>p.u=='kg'?.5:1;
const of=()=>D.p.filter(p=>p.old>p.pr),still=()=>!matchMedia('(prefers-reduced-motion:reduce)').matches;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
const reveal=()=>document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e));
/* product card: branded placeholder underneath, photo on top when present */
const card=(p,i)=>`<article class="pc rv" style="--i:${i%6}"><div class="im"><img class="ph" src="logo.png" alt="" aria-hidden="true">${p.img?`<img class="pp" loading="lazy" decoding="async" src="${E(p.img)}" alt="${E(p.n)}" onerror="this.remove()">`:''}${p.old>p.pr?`<b class="tag">-${Math.round(100-p.pr/p.old*100)}%</b>`:''}</div><h4>${E(p.n)}</h4><div class="pr">${M(p.pr)}<small> / ${E(p.u)}</small>${p.old>p.pr?`<s>${M(p.old)}</s>`:''}</div><button class="btn" data-add="${E(p.id)}">Add to basket</button></article>`;
const grid=(l,msg)=>l.length?`<div class="pg">${l.map(card).join('')}</div>`:`<p class="em">${msg||'Nothing here yet. Check back soon.'}</p>`;
const sec=(t,b,l,sub)=>b?`<section><div class="sh"><div><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div>${l?`<a href="${l}">View all</a>`:''}</div>${b}</section>`:'';
const tile=(c,k)=>{const n=D.p.filter(p=>p.c==c.id).length;return `<a class="ct rv${c.img?'':' noimg'}" style="--i:${k%4}" href="#cat/${E(c.id)}">${c.img?`<img loading="lazy" decoding="async" src="${E(c.img)}" alt="" onerror="this.parentNode.classList.add('noimg');this.remove()">`:''}<span><b>${E(c.n)}</b><small>${n} item${n==1?'':'s'}</small></span></a>`};
function dealSec(){const d=D.p.find(p=>p.deal);if(!d)return'';return `<section><div class="deal rv"><div class="di im" style="border-radius:0"><img class="ph" src="logo.png" alt="" aria-hidden="true">${d.img?`<img class="pp" loading="lazy" src="${E(d.img)}" alt="${E(d.n)}" onerror="this.remove()">`:''}</div><div class="dt"><span class="lb">Deal of the day</span><h3>${E(d.n)}</h3><div class="pr">${M(d.pr)}<small> / ${E(d.u)}</small>${d.old>d.pr?`<s>${M(d.old)}</s>`:''}</div><div class="cd" id="cd"></div><div><button class="btn" data-add="${E(d.id)}">Add to basket</button></div></div></div></section>`}
function home(){const c=D.cfg,hasOffers=of().length>0;
return `<div class="hero"><div class="hc"><span class="ey">The Commons, Mirdif</span><h1>Fresh groceries, better living.</h1><p>Fresh food and everyday essentials from your neighbourhood supermarket. Order on WhatsApp. ${E(c.free)}.</p><div class="hb"><a class="btn w" href="#cat/${D.cats[0].id}">Shop now</a><a class="btn o" href="https://wa.me/${E(c.wa)}" target="_blank" rel="noopener">Chat on WhatsApp</a></div><div class="tr"><span>Fresh every day</span><span>Open ${E(c.hours)}</span><span>No online payment</span></div></div><div class="hv" id="hv"></div></div>
<div class="why"><div><b>Fresh every day</b><small>Fruit, vegetables, butchery, seafood and bakery</small></div><div><b>Free local delivery</b><small>${E(c.free)}</small></div><div><b>Order on WhatsApp</b><small>Our team confirms every order with you</small></div><div><b>Open late</b><small>${E(c.hours)}</small></div></div>
${sec('Shop by category','<div class="cg">'+D.cats.map(tile).join('')+'</div>')}
${dealSec()}
<div class="bn"><a class="b1 rv" href="#offers"><h3>Special offers</h3><span>${hasOffers?'Save on everyday items':'Check back soon for new offers'}</span></a><a class="b2 rv" href="#new"><h3>New arrivals</h3><span>Just added to our shelves</span></a></div>
${sec('Featured products',D.p.some(p=>p.feat)?grid(D.p.filter(p=>p.feat).slice(0,10)):'','','Hand-picked by our team')}
${sec('Best sellers',D.p.some(p=>p.best)?grid(D.p.filter(p=>p.best).slice(0,10)):'','','Customer favourites')}
${sec('Special offers',hasOffers?grid(of().slice(0,10)):'','#offers')}
${sec('New arrivals',grid(D.p.slice(-10).reverse()),'#new')}`}
function heroVisual(){const h=$('#hv');if(!h)return;const i=new Image();i.onload=()=>{h.innerHTML='<img class="hh" alt="" src="images/hero.jpg">';h.classList.add('has')};i.onerror=()=>{h.innerHTML='<div class="mo">'+['fruits','vegetables','bakery'].map(x=>{const c=D.cats.find(k=>k.id==x);return c&&c.img?`<img alt="" src="${E(c.img)}" onload="document.getElementById('hv').classList.add('has')" onerror="this.remove()">`:''}).join('')+'</div>'};i.src='images/hero.jpg'}
const about=()=>`<section class="tx"><h2>About Coccinelle</h2><p>Coccinelle Supermarket is a neighbourhood market at The Commons, Mirdif. Fresh food and everyday essentials are under one roof: fruit and vegetables, butchery, seafood, bakery, beverages, household, and health and beauty.</p><p>Coccinelle is part of a network of about 800 stores, from supermarkets to convenience stores. Its own brands cover nearly 2,000 everyday products at good value, and the Cocci loyalty card rewards regular shoppers in store.</p><p>Live nearby? Order on WhatsApp. ${E(D.cfg.free)}.</p><p><a class="btn" href="${E(D.cfg.web)}" target="_blank" rel="noopener">Visit coccinelle.ae</a></p></section>`;
const contact=()=>`<section class="tx"><h2>Visit or contact us</h2><p><b>Address:</b> ${E(D.cfg.addr)}</p><p><b>Open:</b> ${E(D.cfg.hours)}</p><p><b>Phone:</b> <a href="tel:${E(D.cfg.phone)}">${E(D.cfg.phoneLabel)}</a></p><p><a class="btn" href="https://wa.me/${E(D.cfg.wa)}" target="_blank" rel="noopener">Chat on WhatsApp</a> <a class="btn k" href="${E(D.cfg.map)}" target="_blank" rel="noopener">Open in Maps</a></p><div class="lk"><a href="${E(D.cfg.ig)}" target="_blank" rel="noopener">Instagram</a><a href="${E(D.cfg.fb)}" target="_blank" rel="noopener">Facebook</a><a href="${E(D.cfg.cat)}" target="_blank" rel="noopener">WhatsApp catalogue</a></div></section>`;
function route(){if(!D)return;$('#q').value='';const h=decodeURIComponent(location.hash.slice(1)||'home').split('/'),a=h[0],c=D.cats.find(x=>x.id==h[1]);
const pages={home,about,contact,offers:()=>sec('Special offers',grid(of())),deals:()=>sec('Deal of the day',grid(D.p.filter(p=>p.deal)))+sec('All discounted items',grid(of())),new:()=>sec('New arrivals',grid(D.p.slice(-12).reverse())),cat:()=>c?sec(E(c.n),grid(D.p.filter(p=>p.c==c.id))):home()};
$('#app').innerHTML=(pages[a]||home)();
const cur='#'+(a=='cat'?'cat/'+h[1]:a);document.querySelectorAll('nav a').forEach(x=>{const on=x.getAttribute('href')==cur;x.classList.toggle('on',on);if(on)x.scrollIntoView({inline:'center',block:'nearest'})});
document.title=(a=='cat'&&c?c.n+' | ':'')+'Coccinelle Supermarket, The Commons, Mirdif, Dubai';
scrollTo(0,0);reveal();heroVisual();tick()}
let qt;function srch(){clearTimeout(qt);qt=setTimeout(()=>{const v=$('#q').value.trim().toLowerCase();if(v.length<2)return route();const cn=id=>(D.cats.find(c=>c.id==id)||{}).n||'';$('#app').innerHTML=sec('Results for "'+E(v)+'"',grid(D.p.filter(p=>(p.n+' '+cn(p.c)).toLowerCase().includes(v)),'No products match your search. Try another word or browse a category.'));reveal()},150)}
function tick(){const e=$('#cd');if(!e)return;const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.floor((m-n)/1e3),f=x=>String(x).padStart(2,'0');e.textContent=`Offer day ends in ${f(s/3600|0)}:${f(s%3600/60|0)}:${f(s%60)}`}
setInterval(tick,1000);
function fly(b){const c=b.closest('.pc,.deal'),s=(c&&c.querySelector('.im'))||b,r=s.getBoundingClientRect(),t=$('.cb').getBoundingClientRect(),d=document.createElement('div');d.className='fly';d.style.left=(r.left+r.width/2-22)+'px';d.style.top=(r.top+r.height/2-22)+'px';document.body.append(d);
d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${t.left+t.width/2-r.left-r.width/2}px,${t.top+t.height/2-r.top-r.height/2}px) scale(.25)`,opacity:.3}],{duration:700,easing:'cubic-bezier(.5,-.2,.7,.4)'}).onfinish=()=>d.remove()}
function add(id,b){if(!P(id))return;cart[id]=+((cart[id]||0)+st(P(id))).toFixed(1);sv();upd();const x=$('.cb');x.classList.remove('bump');void x.offsetWidth;x.classList.add('bump');if(b&&still())fly(b)}
function chg(id,d){cart[id]=Math.max(0,+((cart[id]||0)+d*st(P(id))).toFixed(1));if(!cart[id])delete cart[id];sv();upd();drawer()}
const items=()=>Object.keys(cart).map(P).filter(Boolean),tot=()=>items().reduce((s,p)=>s+p.pr*cart[p.id],0),upd=()=>{$('#cn').textContent=items().length};
function tg(){const p=document.querySelector('input[value=Pickup]').checked;$('#dd').style.display=p?'none':'grid'}
function drawer(){const l=items(),f=['nm','ph','lc'],s=f.map(i=>($('#'+i)||{}).value||''),pk=document.querySelector('input[value=Pickup]'),was=pk&&pk.checked;
$('#sh').innerHTML='<h3>Your order</h3>'+(l.length?l.map(p=>`<div class="ci"><span>${E(p.n)}<small>${M(p.pr)} / ${E(p.u)}</small></span><span class="q"><button data-chg="${E(p.id)}" data-d="-1" aria-label="Decrease ${E(p.n)}">−</button>${cart[p.id]} ${E(p.u)}<button data-chg="${E(p.id)}" data-d="1" aria-label="Increase ${E(p.n)}">+</button></span></div>`).join('')+`<p class="tt">Total ${M(tot())}</p><div class="fm"><div><label><input type="radio" name="t" value="Delivery" checked> Delivery</label><label><input type="radio" name="t" value="Pickup"> Pickup</label></div><div id="dd"><input id="nm" placeholder="Your name" autocomplete="name"><input id="ph" type="tel" placeholder="Your WhatsApp number" autocomplete="tel"><input id="lc" placeholder="Building, area, location" autocomplete="street-address"></div></div><button class="btn" id="sendBtn">Send order on WhatsApp</button>`:'<p class="em">Your basket is empty.</p>')+`<button class="x" id="closeDr">Close</button>`;
if(l.length){f.forEach((i,k)=>$('#'+i).value=s[k]);if(was){document.querySelector('input[value=Pickup]').checked=true;tg()}}$('#dr').classList.add('o')}
function send(){const t=document.querySelector('input[name=t]:checked').value,n=$('#nm').value.trim(),ph=$('#ph').value.trim(),lc=$('#lc').value.trim();
if(t=='Delivery'&&!(n&&ph&&lc))return alert('Please enter your name, WhatsApp number and location.');
const m='Hello Coccinelle, I would like to order:\n'+items().map(p=>`- ${p.n}: ${cart[p.id]} ${p.u} = ${M(p.pr*cart[p.id])}`).join('\n')+`\nTotal: ${M(tot())}\nOrder type: ${t}`+(t=='Delivery'?`\nName: ${n}\nPhone: ${ph}\nLocation: ${lc}`:'');
open('https://wa.me/'+D.cfg.wa+'?text='+encodeURIComponent(m),'_blank')}
/* one delegated listener for all buttons */
document.addEventListener('click',e=>{const t=e.target,a=t.closest('[data-add]');if(a)return add(a.dataset.add,a);const c=t.closest('[data-chg]');if(c)return chg(c.dataset.chg,+c.dataset.d);if(t.closest('#sendBtn'))return send();if(t.closest('#closeDr')||t.id=='dr')return $('#dr').classList.remove('o');if(t.closest('#cartBtn'))drawer()});
document.addEventListener('change',e=>{if(e.target.name=='t')tg()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#dr').classList.remove('o')});
$('#q').addEventListener('input',srch);
const FB={apiKey:"AIzaSyDg7DfIV3f1pA5qV_VGgvoQV24Y2QvWiK8",authDomain:"coccinelle-supermarket.firebaseapp.com",projectId:"coccinelle-supermarket",storageBucket:"coccinelle-supermarket.firebasestorage.app",messagingSenderId:"227874611552",appId:"1:227874611552:web:b30f8ab364ff89e4cffe05"};
/* Live data from Firestore. Falls back silently to products.json if it cannot be read. */
async function live(){try{const u='https://www.gstatic.com/firebasejs/10.12.2/',[a,f]=await Promise.all([import(u+'firebase-app.js'),import(u+'firebase-firestore.js')]);const db=f.getFirestore(a.initializeApp(FB)),[s,cs]=await Promise.all([f.getDocs(f.collection(db,'products')),f.getDocs(f.collection(db,'categories')).catch(()=>null)]);
const byName=new Map(D.p.map(p=>[p.n.toLowerCase(),p.c])),ids=new Set(D.cats.map(c=>c.id)),fix=p=>ids.has(p.category)?p.category:(byName.get((p.name||'').toLowerCase())||D.legacy[p.category]||p.category);
const prods=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.available!==false&&p.name).map(p=>{const c=p.createdAt||{};return{id:p.id,c:fix(p),n:p.name,u:p.unit||'pc',pr:+p.price||0,old:+p.oldPrice||0,img:p.imageUrl||p.imageData||'',deal:p.deal?1:0,feat:p.featured?1:0,best:p.bestSeller?1:0,t:(c.seconds||0)*1e3+(c.nanoseconds||0)/1e6}}).sort((x,y)=>x.t-y.t);
const cats=cs?cs.docs.map(d=>({id:d.id,...d.data()})):[];return{prods,cats}}catch(e){return{prods:[],cats:[]}}}
fetch('products.json?'+Date.now()).then(r=>r.json()).then(async d=>{D=d;const l=await live();if(l.prods.length)D.p=l.prods;
l.cats.forEach(o=>{const c=D.cats.find(x=>x.id==o.id);if(c&&o.imageUrl)c.img=o.imageUrl});
$('nav').innerHTML=[['home','Home'],...D.cats.map(c=>['cat/'+c.id,c.n]),['offers','Offers'],['deals','Deals'],['about','About'],['contact','Contact']].map(([h,t])=>`<a href="#${E(h)}">${E(t)}</a>`).join('');
$('#bar').innerHTML=`<b>${E(D.cfg.free)}</b> · Open ${E(D.cfg.hours)} · Order on WhatsApp`;
$('#f1').innerHTML=`<h5>Visit us</h5><p>${E(D.cfg.addr)}</p><p>Open ${E(D.cfg.hours)}</p><p><a href="tel:${E(D.cfg.phone)}">${E(D.cfg.phoneLabel)}</a></p><p><a href="${E(D.cfg.map)}" target="_blank" rel="noopener">Open in Maps</a></p>`;
$('#f2').innerHTML=`<h5>Follow &amp; order</h5><ul><li><a href="https://wa.me/${E(D.cfg.wa)}" target="_blank" rel="noopener">WhatsApp</a></li><li><a href="${E(D.cfg.ig)}" target="_blank" rel="noopener">Instagram</a></li><li><a href="${E(D.cfg.fb)}" target="_blank" rel="noopener">Facebook</a></li><li><a href="${E(D.cfg.cat)}" target="_blank" rel="noopener">WhatsApp catalogue</a></li></ul>`;
upd();route()}).catch(()=>{$('#app').innerHTML='<p class="em" style="padding:30px 0">Could not load products. Please refresh.</p>'});
addEventListener('hashchange',route);
</script>
</body>
