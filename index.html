<style>

.fly{position:fixed;width:44px;height:44px;border-radius:50%;z-index:60;pointer-events:none;background:radial-gradient(circle at 32% 28%,#e0505e,var(--r) 60%,var(--rx));box-shadow:0 8px 14px #0006}
#dr{position:fixed;inset:0;background:#170a0c99;display:none;z-index:50}#dr.o{display:block}
#sh{position:absolute;bottom:0;left:0;right:0;max-width:520px;margin:auto;max-height:90vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px;display:grid;gap:10px;animation:sl .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateY(100%)}}
.ci{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #eee;padding-bottom:8px}

.tt{font-weight:700;font-size:18px}

@media(min-width:760px){.sb{order:2;flex:0 1 300px}.cb{order:3}.lg{height:54px;max-width:none}}
</style></head><body>
<header><a class="lg" href="#home"><img src="logo.png" alt="Coccinelle Supermarket"></a><label class="sb"><svg class="si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="Search products" oninput="srch()"></label><button class="cb" onclick="drawer()" aria-label="Basket"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><i id="cn">0</i></button></header>
<nav></nav>
<main id="app"><p class="em" style="padding:30px 0">Loading…</p></main>
<footer><img src="logo.png" alt="Coccinelle"><div id="ft"></div><div>Orders are confirmed on WhatsApp. No online payment.</div></footer>
<div id="dr" onclick="if(event.target==this)this.classList.remove('o')"><div id="sh"></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt()+';'),M=n=>'AED '+Number(n).toFixed(2);
let D,cart={};try{cart=JSON.parse(localStorage.cc||'{}')}catch(e){}

function home(){const t=[E(D.cfg.free),'Fresh every day','Order on WhatsApp, no online payment','Open '+E(D.cfg.hours)].map(x=>`<span>${x}</span>`).join('');
return `<div class="hero"><div><h1><span><i style="--d:1">Fresh</i></span> <span><i style="--d:2">groceries,</i></span> <span><i style="--d:3">better</i></span> <span><i style="--d:4">living.</i></span></h1><p>Fresh food and everyday essentials from The Commons, Mirdif. Order on WhatsApp. ${E(D.cfg.free)}.</p><a class="btn w" href="#cat/${D.cats[0].id}">Shop now</a></div><div class="orbs"><b class="o1"></b><b class="o2"></b><b class="o3"></b><b class="o4"></b></div></div>
<div class="tk"><div>${t+t}</div></div>
${sec('Shop by category','<div class="cg">'+D.cats.map(tile).join('')+'</div>')}
<div class="bn"><a class="b1 rv" href="#offers"><h3>Weekly offers</h3><span>Save on everyday items</span></a><a class="b2 rv" href="#deals"><h3>Deal of the day</h3><span id="cd"></span></a></div>
${sec('Offers this week',grid(of().slice(0,6)),'#offers')}${sec('New arrivals',grid(D.p.slice(-6)),'#new')}`}
const about=()=>`<section class="tx"><h2>About Coccinelle</h2><p>Coccinelle Supermarket is a neighbourhood market at The Commons, Mirdif. Fresh food and everyday essentials are under one roof: vegetables, butchery, seafood, bakery, beverages, household, and health and beauty.</p><p>Coccinelle is part of a network of about 800 stores, from supermarkets to convenience stores. Its own brands cover nearly 2,000 everyday products at good value, and the Cocci loyalty card rewards regular shoppers in store.</p><p>Live nearby? Order on WhatsApp. ${E(D.cfg.free)}.</p><p><a class="btn" href="${E(D.cfg.web)}" target="_blank" rel="noopener">Visit coccinelle.ae</a></p></section>`;
const contact=()=>`<section class="tx"><h2>Visit or contact us</h2><p><b>Address:</b> ${E(D.cfg.addr)}</p><p><b>Open:</b> ${E(D.cfg.hours)}</p><p><b>Phone:</b> <a href="tel:+97143499605">+971 4 349 9605</a></p><p><a class="btn" href="https://wa.me/${E(D.cfg.wa)}" target="_blank" rel="noopener">Chat on WhatsApp</a> <a class="btn k" href="${E(D.cfg.map)}" target="_blank" rel="noopener">Open in Maps</a></p><div class="lk"><a href="${E(D.cfg.ig)}" target="_blank" rel="noopener">Instagram</a><a href="${E(D.cfg.fb)}" target="_blank" rel="noopener">Facebook</a><a href="${E(D.cfg.cat)}" target="_blank" rel="noopener">WhatsApp catalogue</a></div></section>`;
function route(){if(!D)return;$('#q').value='';const h=decodeURIComponent(location.hash.slice(1)||'home').split('/'),a=h[0],c=D.cats.find(x=>x.id==h[1]);
const pages={home,about,contact,offers:()=>sec('Offers this week',grid(of())),deals:()=>sec('Deal of the day',grid(D.p.filter(p=>p.deal)))+sec('All discounted items',grid(of())),new:()=>sec('New arrivals',grid(D.p.slice(-12).reverse())),cat:()=>c?sec(E(c.n),grid(D.p.filter(p=>p.c==c.id))):home()};

const cur='#'+(a=='cat'?'cat/'+h[1]:a);document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.getAttribute('href')==cur));
scrollTo(0,0);document.querySelectorAll('.rv').forEach(e=>io.observe(e));tick()}

function tick(){const e=$('#cd');if(!e)return;const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.floor((m-n)/1e3),f=x=>String(x).padStart(2,'0');e.textContent=`Ends in ${f(s/3600|0)}:${f(s%3600/60|0)}:${f(s%60)}`}
setInterval(tick,1000);
let tc;const rt=()=>{if(tc){tc.style.transform='';tc=null}};
document.addEventListener('pointermove',e=>{if(e.pointerType!='mouse'||!still())return;const h=$('.hero');if(h){const r=h.getBoundingClientRect();h.style.setProperty('--mx',((e.clientX-r.left)/r.width-.5).toFixed(2));h.style.setProperty('--my',((e.clientY-r.top)/r.height-.5).toFixed(2))}
const c=e.target.closest&&e.target.closest('.pc');if(c!=tc)rt();if(!c)return;tc=c;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateX(${-y*9}deg) rotateY(${x*9}deg) translateY(-4px)`});
document.addEventListener('pointerleave',rt);
function fly(b){const c=b.closest('.pc'),s=(c&&c.querySelector('.im'))||b,r=s.getBoundingClientRect(),t=$('.cb').getBoundingClientRect(),d=document.createElement('div');d.className='fly';d.style.left=(r.left+r.width/2-22)+'px';d.style.top=(r.top+r.height/2-22)+'px';document.body.append(d);
d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${t.left+t.width/2-r.left-r.width/2}px,${t.top+t.height/2-r.top-r.height/2}px) scale(.25)`,opacity:.3}],{duration:700,easing:'cubic-bezier(.5,-.2,.7,.4)'}).onfinish=()=>d.remove()}

function chg(id,d){cart[id]=Math.max(0,+((cart[id]||0)+d*st(P(id))).toFixed(1));if(!cart[id])delete cart[id];sv();upd();drawer()}
const items=()=>Object.keys(cart).map(P).filter(Boolean),tot=()=>items().reduce((s,p)=>s+p.pr*cart[p.id],0),upd=()=>{$('#cn').textContent=items().length};
