<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#47050c">
<title>COCCINELLE Admin</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin/admin.css?v=1">
</head>
<body>
<div id="splash" class="splash"><img src="logo.png" alt="" width="120"><p>Loading dashboard…</p></div>

<main id="login" class="authwrap" hidden>
<form id="lf" class="authcard" novalidate>
<img src="logo.png" alt="COCCINELLE Supermarket" width="150">
<h1>Admin sign in</h1><p class="muted">Enter your username or email, and your password.</p>
<label>Username or email<input id="le" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
<label>Password<input id="lp" type="password" autocomplete="current-password" required></label>
<button class="btn wide" id="lb" type="submit">Sign in</button><p id="lst" class="st" role="status"></p>
<p class="fine">Never share your password. Only approved admin accounts can see business data.</p>
</form>
</main>

<main id="denied" class="authwrap" hidden>
<div class="authcard"><img src="logo.png" alt="COCCINELLE Supermarket" width="150"><h1>Access not available</h1><p id="dmsg" class="er"></p><button class="btn wide" data-logout>Sign out</button></div>
</main>

<div id="shell" hidden>
<div id="scrim" class="scrim"></div>
<aside id="side" aria-label="Main navigation">
<a class="brand" href="#/overview"><img src="logo.png" alt="COCCINELLE" width="150"></a>
<nav id="nav"></nav>
<div class="sfoot"><div class="who"><b id="who"></b><span id="role"></span></div><button class="btn ghost sm light" data-logout>Sign out</button></div>
</aside>
<div class="main">
<header class="top">
<button id="burger" class="ib mob" aria-label="Open menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<h1 id="ttl">Overview</h1><span class="sp"></span>
<div id="rng" class="rng" hidden><label class="sr" for="rk">Date range</label><select id="rk"></select><span id="rc" hidden><label class="sr" for="rgf">From</label><input id="rgf" type="date"><span aria-hidden="true">to</span><label class="sr" for="rgt">To</label><input id="rgt" type="date"></span></div>
<button id="rfs" class="ib" aria-label="Refresh products"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.500-3.500L4 9M4 5v4h4M4 13a8 8 0 0 0 14.500 3.500L20 15M20 19v-4h-4"/></svg></button>
<button id="bell" class="ib" aria-label="No orders waiting" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.500 2h-15z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><b class="bc" hidden>0</b></button>
</header>
<main id="view" class="content" tabindex="-1"></main>
</div>
</div>

<div id="modal" class="modal"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="print"></div>
<script type="module" src="admin/app.js?v=1"></script>
</body>
</html>
